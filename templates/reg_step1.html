{% extends "_base_reg.html" %}
{% block content %}
  <div class="sub">Правила транслита</div>

  <form class="card" action="{{ url_for('reg', stage='step1') }}" method="post" autocomplete="off">
    <div class="center" style="font-size:20px;margin-bottom:6px;">*Введите желаемый ник:</div>
    <div class="center"><input type="text" name="nick" required></div>
    <div class="center" style="margin:10px 0;">
      <label style="font-weight:400;"><input type="checkbox" name="translit"> Транслит</label>
    </div>
    <div class="center"><button class="btn" type="submit">Продолжить</button></div>
    {% if error %}
      <div class="center" style="color:#a11;margin-top:8px">{{ error }}</div>
    {% endif %}
  </form>

  <div class="center links"><a href="{{ url_for('index') }}">&lt;&lt; Главная &lt;&lt;</a></div>
{% endblock %}
