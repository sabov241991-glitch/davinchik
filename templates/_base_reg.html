<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ header_title }}</title>
<style>
  :root{
    --bg1:#c9d3e3; --bg2:#bfcade;
    --panel:#eef3fb;
    --rim-dark:#8e9db6; --rim-mid:#b5c1d6; --rim-light:#e9eff8;
    --ink:#0a0a0a; --link:#0c49b7;
  }
  html,body{margin:0;padding:0;background:linear-gradient(#cad4e5,#b8c6dc) fixed;
            font-family:"Times New Roman", Georgia, serif;color:var(--ink);}
  .wrap{max-width:720px;margin:10px auto 20px;background:linear-gradient(#d5dff0,#d0dbed);
        border-radius:14px;padding:10px;box-shadow:
        0 0 0 1px var(--rim-dark) inset,0 0 0 4px var(--rim-mid) inset,0 0 0 8px var(--rim-light) inset;}
  .head{ text-align:center;font-weight:700;font-size:28px;color:#0a2b4f;text-shadow:0 1px 0 #fff;
         margin:6px 8px 10px;padding:10px;border-radius:12px;background:var(--panel);
         box-shadow: inset 0 0 0 2px var(--rim-light), inset 0 0 0 6px #fff;}
  .card{background:#f1f5fd;border-radius:12px;padding:14px 12px;margin:10px;
        box-shadow: inset 0 0 0 2px #dbe5f6, inset 0 0 0 6px #ffffff;}
  .title{font-size:30px;text-align:center;color:#213a66;text-shadow:0 1px 0 #fff;font-weight:700;margin:4px 0}
  .sub{font-size:22px;color:#102c64;text-align:center;text-decoration:underline;margin:6px 0}
  .sep{height:1px;margin:10px 6px;background:linear-gradient(90deg,#b7c4d9,#eef3fb,#b7c4d9)}
  .center{text-align:center}
  .links a{color:#103a93;text-decoration:none} .links a:hover{text-decoration:underline}
  .badge{display:inline-block;background:#fff;border:1px solid #b8c6df;border-radius:8px;padding:4px 8px;margin:6px 2px}
  /* элементы форм */
  label{font-weight:700}
  input[type=text],input[type=password],input[type=email]{width:80%;max-width:420px;padding:7px 10px;
      border:1px solid #8fa1b8;border-radius:6px;background:#fff;box-shadow:inset 0 1px 0 #ffffff, inset 0 0 0 2px #e7edf8;}
  textarea{width:85%;max-width:500px;height:120px;padding:8px;border:1px solid #8fa1b8;border-radius:6px;background:#fff;
      box-shadow:inset 0 1px 0 #ffffff, inset 0 0 0 2px #e7edf8;}
  select{padding:5px 8px;border:1px solid #8fa1b8;border-radius:6px;background:#fff}
  .btn{display:inline-block;background:#f2f6ff;border:1px solid #8ea2c7;border-radius:8px;padding:6px 14px;cursor:pointer}
  /* мелкие подписи */
  .ascii{color:#4a5e86}
  .footer{margin:12px auto 6px;text-align:center;color:#22395c}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">ДАВИНЧИК</div>
  <div class="card">
    <div class="title">{{ header_title }}</div>
    {% block content %}{% endblock %}
  </div>

  <!-- НИЖНИЙ БЛОК как на главной -->
  <div class="center">
    <span class="badge">[ {{ perf_time }} | Сжатие: {{ compression_pct }}% ]</span>
  </div>
  <div class="footer">©ДАВИНЧИК ©2025</div>
</div>
</body>
</html>
