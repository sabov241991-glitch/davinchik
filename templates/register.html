<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <style>
    body { font-family: Arial; background: #d0f0f7; text-align: center; }
    .form-box { margin: 30px auto; padding: 20px; background: #fff; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
    input, select, textarea { display:block; width:90%; margin:10px auto; padding:8px; border-radius:8px; border:1px solid #ccc;}
    textarea { resize:none; height:80px; }
    .btn { padding:10px 20px; background:#28a745; color:#fff; border:none; border-radius:8px; cursor:pointer; }
    .error { color:red; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Регистрация</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="text" name="nickname" placeholder="Ник" required>
      <input type="password" name="password" placeholder="Пароль" required>
      <input type="password" name="confirm" placeholder="Повторите пароль" required>
      <input type="text" name="birthday" placeholder="Дата рождения (03.07.1991)" required>
      <input type="text" name="country" placeholder="Страна" required>
      <select name="gender" required>
        <option value="">Выберите пол</option>
        <option value="мужской">Мужской</option>
        <option value="женский">Женский</option>
      </select>
      <textarea name="about" placeholder="О себе"></textarea>
      <button class="btn" type="submit">Зарегистрироваться</button>
    </form>
  </div>
</body>
</html>
