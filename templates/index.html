<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прихожая — Давинчик 💌</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    async function refreshStats() {
      try {
        const r = await fetch("/api/stats");
        const d = await r.json();
        document.getElementById("registered").innerText = d.registered;
        document.getElementById("roomcount").innerText = d.room_count;
        document.getElementById("roomname").innerText = d.room_name;
      } catch(e){}
    }
    setInterval(refreshStats, 5000);
    document.addEventListener('DOMContentLoaded', refreshStats);
  </script>
</head>
<body class="screen">
  <div class="card">
    <div class="toprow">
      <h1>Давинчик 💌</h1>
      <div class="muted">Роль: <b>{{ role }}</b></div>
      <a class="link" href="{{ url_for('logout') }}">Выйти</a>
    </div>

    <div class="stats">
      <div class="stat">Зарегистрировано: <b id="registered">{{ registered }}</b></div>
      <div class="stat">Онлайн в комнате: <b id="roomcount">{{ room_count }}</b></div>
    </div>

    <div class="room">
      <div class="room-name">«<span id="roomname">{{ room_name }}</span>» (<span id="roomcount2">{{ room_count }}</span>)</div>
      <div class="grid2">
        <a class="btn" href="{{ url_for('chat') }}">Войти в Общение</a>
        <a class="btn outline" href="{{ url_for('profile', nick=username) }}">Профиль</a>
      </div>
    </div>
  </div>
  <script>
    setInterval(()=> {
      const v = document.getElementById('roomcount').innerText;
      document.getElementById('roomcount2').innerText = v;
    }, 1000);
  </script>
</body>
</html>
