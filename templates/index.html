<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Давинчик</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 20px;
      font-size: 40px;
      color: #fff;
    }
    .main-image {
      width: 90%;
      max-width: 350px;
      margin: 20px auto;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .counter {
      font-size: 22px;
      margin: 15px 0;
      color: #fff;
    }
    .buttons {
      margin: 15px 0;
    }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      margin: 5px;
      border-radius: 10px;
      background: #fff;
      color: #ff4b5c;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    .stats {
      margin-top: 20px;
      text-align: left;
      display: inline-block;
      background: rgba(255,255,255,0.7);
      padding: 10px 20px;
      border-radius: 12px;
    }
    .stats p {
      font-size: 18px;
      margin: 8px 0;
    }
    .icon {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <h1>💌 Давинчик</h1>
  <img src="https://i.imgur.com/n9z3sLg.jpeg" alt="Давинчик" class="main-image">
  <div class="counter">Сейчас в сети: ({{ users|length }})</div>

  <div class="buttons">
    <a href="{{ url_for('login') }}" class="btn">Вход</a>
    <a href="{{ url_for('register') }}" class="btn">Зарегистрироваться</a>
  </div>

  <div class="stats">
    <p>📜 Регистраций ({{ users|length }})</p>
    <p>👩 Девушек ({{ users|selectattr('gender','equalto','женский')|list|length }})</p>
    <p>👨 Парней ({{ users|selectattr('gender','equalto','мужской')|list|length }})</p>
  </div>
</body>
</html>
