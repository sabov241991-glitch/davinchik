<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Давинчик 💌</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin-top: 30px;
            font-size: 48px;
            color: #fff;
        }
        img {
            width: 300px;
            margin: 20px auto;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
        }
        .counter {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
        }
        .buttons {
            margin: 20px;
        }
        .btn {
            padding: 12px 25px;
            margin: 10px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            transition: 0.3s;
        }
        .btn:hover {
            background: #f5f5f5;
        }
        .stats {
            margin-top: 30px;
            text-align: left;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-item {
            font-size: 18px;
            margin: 8px 0;
            color: #fff;
            display: flex;
            align-items: center;
        }
        .stat-item span {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Давинчик 💌</h1>
    <img src="https://i.imgur.com/q7nZ4Wb.png" alt="Давинчик">

    <div class="counter">Сейчас внутри ({{ users|length }})</div>

    <div class="buttons">
        <a href="/login"><button class="btn">Вход</button></a>
        <a href="/register"><button class="btn">Зарегистрироваться</button></a>
    </div>

    <div class="stats">
        <div class="stat-item">👥 <span>Регистраций ({{ users|length }})</span></div>
        <div class="stat-item">👩 <span>Девушек ({{ girls }})</span></div>
        <div class="stat-item">👨 <span>Парней ({{ boys }})</span></div>
    </div>
</body>
</html>
