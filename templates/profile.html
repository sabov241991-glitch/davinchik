<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - {{ username }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ваш профиль</h1>
        </div>
        
        <div class="auth-form">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2>Никнейм: {{ username }}</h2>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <a href="{{ url_for('chat') }}" style="padding: 10px; background: #333; color: white; text-decoration: none; text-align: center; border-radius: 5px;">
                    Вернуться в чат
                </a>
                <a href="{{ url_for('logout') }}" style="padding: 10px; background: #f44336; color: white; text-decoration: none; text-align: center; border-radius: 5px;">
                    Выйти
                </a>
            </div>
        </div>
    </div>
</body>
</html>
