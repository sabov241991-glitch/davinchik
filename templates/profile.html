<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - {{ username }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ваш профиль</h1>
        </div>
        <div class="auth-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2>Никнейм: {{ username }}</h2>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <a href="{{ url_for('chat') }}" class="btn">Вернуться в чат</a>
                <a href="{{ url_for('logout') }}" class="btn" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">Выйти</a>
            </div>
        </div>
    </div>
</body>
</html>
