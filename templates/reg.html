<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ДАВИНЧИК — Регистрация</title>
<style>
  :root{
    --bg1:#c9d3e3; --bg2:#bfcade;
    --panel:#eef3fb;
    --rim-dark:#8e9db6;
    --rim-mid:#b5c1d6;
    --rim-light:#e9eff8;
    --ink:#0a0a0a;
    --link:#0c49b7;
  }
  html,body{
    margin:0;padding:0;background:linear-gradient(#cad4e5,#b8c6dc) fixed;
    font-family:"Times New Roman", Georgia, serif;color:var(--ink);
  }
  .wrap{
    max-width:720px;margin:8px auto 20px;background:linear-gradient(#d5dff0,#d0dbed);
    border-radius:14px;position:relative;padding:10px;
    box-shadow:0 0 0 1px var(--rim-dark) inset,0 0 0 4px var(--rim-mid) inset,
               0 0 0 8px var(--rim-light) inset,0 1px 0 #7f8da6,0 2px 0 #aebad0;
  }
  .panel{
    background:var(--panel);border-radius:12px;padding:10px;position:relative;
    box-shadow:inset 0 0 0 2px var(--rim-light), inset 0 0 0 6px #fff;
  }

  /* Шапка — как на главной */
  .head{
    text-align:center;font-weight:700;font-size:32px;letter-spacing:1px;color:#0a2b4f;
    text-shadow:0 1px 0 #fff;margin:4px 6px 8px;padding:10px 8px;border-radius:12px;
    background:var(--panel);
    box-shadow:inset 0 0 0 2px var(--rim-light), inset 0 0 0 6px #fff,
               0 1px 0 #7f8da6,0 2px 0 #aebad0;
  }
  .sep{height:1px;margin:8px 4px;background:linear-gradient(90deg,#b7c4d9,#eef3fb,#b7c4d9)}
  .center{text-align:center}
  .small{font-size:14px}
  .ascii{color:#4a5e86}

  .card{
    border-radius:12px;margin:8px;padding:12px 10px;background:#f1f5fd;
    box-shadow:inset 0 0 0 2px #dbe5f6, inset 0 0 0 6px #ffffff;
  }

  /* Заголовок "Регистрация" — НЕ жирный */
  .page-title{
    font-size:26px;font-weight:400;color:#162e56;margin-bottom:6px;
  }

  .btn{
    display:inline-block;background:#f2f6ff;border:1px solid #8ea2c7;border-radius:8px;
    padding:6px 14px;cursor:pointer;text-decoration:none;color:inherit;
  }
  .links a{color:var(--link);text-decoration:none}
  .links a:hover{text-decoration:underline}

  label{display:block;margin:6px 0 2px;font-weight:700;text-align:center}
  input[type=text],input[type=password],input[type=email],textarea,select{
    width:88%;padding:7px 10px;border:1px solid #8fa1b8;border-radius:6px;background:#fff;
    box-shadow:inset 0 1px 0 #ffffff, inset 0 0 0 2px #e7edf8;margin:0 auto;display:block;box-sizing:border-box;
  }
  .row{display:flex;align-items:center;gap:8px;margin:8px 0;justify-content:center}

  /* Низ — как на главной: компактная плашка сжатия */
  .badge{display:inline-block;font-size:14px;padding:2px 8px;margin:2px 0}
  .copyright{
    display:inline-block;margin-top:6px;padding:6px 12px;border-radius:10px;background:#fff;
    border:1px solid #b8c6df;box-shadow:inset 0 0 0 2px #e7edf8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Шапка -->
    <div class="head">ДАВИНЧИК</div>
    <div class="sep"></div>

    <div class="panel">
      <!-- столько же декоративных строк, как на главной -->
      <div class="center small ascii">-~-</div>

      <div class="card">
        <div class="center page-title">Регистрация</div>
        <div class="center" style="font-size:20px;color:#1f3680;margin-bottom:6px;">Правила транслита</div>

        <form action="/register/step1" method="post" autocomplete="off">
          <label for="nick">*Введите желаемый ник:</label>
          <input id="nick" name="nick" type="text">
          <div class="row"><label style="margin:0;font-weight:400">
            <input type="checkbox" name="translit"> Транслит
          </label></div>
          <div class="center" style="margin-top:6px">
            <button class="btn" type="submit">Продолжить</button>
          </div>
        </form>

        <!-- Кнопка выхода на главную -->
        <div class="center" style="margin-top:10px">
          <a class="btn" href="/">На Главную</a>
        </div>
      </div>

      <div class="center small ascii">-~-</div>
    </div>

    <div class="sep"></div>

    <!-- Низ (компактная плашка сжатия и копирайт) -->
    <div class="center">
      <div class="badge">[ {{ perf_time }} | Сжатие: {{ compression_pct }}% ]</div><br>
      <div class="copyright">©ДАВИНЧИК ©2025</div>
    </div>
  </div>
</body>
</html>
