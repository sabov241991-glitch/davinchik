<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ДАВИНЧИК — Регистрация</title>
<style>
  :root{ --bg1:#c9d3e3; --bg2:#bfcade; --panel:#eef3fb; --rim-dark:#8e9db6; --rim-mid:#b5c1d6; --rim-light:#e9eff8; --ink:#0a0a0a; }
  html,body{ margin:0;padding:0;background:linear-gradient(#cad4e5,#b8c6dc) fixed;font-family:"Times New Roman", Georgia, serif;color:var(--ink); }
  .wrap{ max-width:720px;margin:8px auto 20px;background:linear-gradient(#d5dff0,#d0dbed);border-radius:14px;padding:10px;
         box-shadow:0 0 0 1px var(--rim-dark) inset,0 0 0 4px var(--rim-mid) inset,0 0 0 8px var(--rim-light) inset,0 1px 0 #7f8da6,0 2px 0 #aebad0; }
  .panel{ background:#eef3fb;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 2px #e9eff8, inset 0 0 0 6px #fff; }
  .head{ text-align:center;font-weight:700;font-size:32px;letter-spacing:1px;color:#0a2b4f;text-shadow:0 1px 0 #fff;margin:4px 6px 8px;padding:10px 8px;border-radius:12px;
         background:#eef3fb;box-shadow:inset 0 0 0 2px #e9eff8, inset 0 0 0 6px #fff, 0 1px 0 #7f8da6,0 2px 0 #aebad0;}
  .sep{height:1px;margin:8px 4px;background:linear-gradient(90deg,#b7c4d9,#eef3fb,#b7c4d9)}
  .center{text-align:center} .ascii{color:#4a5e86}
  .card{ border-radius:12px;margin:8px;padding:12px 10px;background:#f1f5fd;box-shadow:inset 0 0 0 2px #dbe5f6, inset 0 0 0 6px #ffffff; }
  .title-in-card{display:inline-block;padding:6px 14px;border-radius:10px;background:#f7f9fe;
                 box-shadow:inset 0 0 0 2px #dbe5f6, inset 0 0 0 6px #ffffff;margin-bottom:10px;font-size:26px;font-weight:400;color:#162e56;}
  label{display:block;margin:6px 0 4px;font-weight:700;text-align:center}
  input[type=text]{ width:88%; padding:7px 10px; border:1px solid #8fa1b8; border-radius:6px; background:#fff;
    box-shadow:inset 0 1px 0 #ffffff, inset 0 0 0 2px #e7edf8; margin:0 auto; display:block; box-sizing:border-box; }
  .btn{display:inline-block;background:#f2f6ff;border:1px solid #8ea2c7;border-radius:8px;padding:6px 14px;cursor:pointer}
  .footer-box{ text-align:center; margin-top:8px; }
  .badge{display:inline-block;font-size:12px;padding:1px 8px;margin:0}
  .copyright{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:10px;background:#fff;border:1px solid #b8c6df;box-shadow:inset 0 0 0 2px #e7edf8;font-size:14px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">ДАВИНЧИК</div>
    <div class="sep"></div>

    <div class="panel">
      <div class="card">
        <div class="center"><span class="title-in-card">Регистрация</span></div>

        <div class="center ascii">Правила транслита</div>
        <label for="nick">*Введите желаемый ник:</label>
        <input id="nick" type="text">
        <div class="center" style="margin:8px 0">
          <label style="font-weight:400;"><input type="checkbox"> Транслит</label>
        </div>
        <div class="center" style="margin-bottom:6px">
          <button class="btn" type="button">Продолжить</button>
        </div>
      </div>

      <div class="center" style="margin-top:6px">
        <a class="btn" href="/">На Главную</a>
      </div>
    </div>

    <div class="sep"></div>

    <div class="footer-box">
      <div class="badge">[ {{ perf_time }} | Сжатие: {{ compression_pct }}% ]</div><br>
      <div class="copyright">©ДАВИНЧИК ©2025</div>
    </div>
  </div>
</body>
</html>
