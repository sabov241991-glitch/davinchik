<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Давинчик Чат</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td bgcolor="#336699" height="60" align="center">
                <font size="6" color="white" face="Arial"><b>🔐 Вход в аккаунт</b></font>
            </td>
        </tr>
    </table>

    <br>

    <table width="400" cellpadding="20" cellspacing="0" border="0" align="center">
        <tr>
            <td bgcolor="#F0F0F0" style="border:2px solid #336699;">
                <center>
                    <font size="4" color="#336699"><b>Авторизация</b></font>
                    <br><br>

                    {% if error %}
                    <div style="color:red; background:#FFEEEE; padding:10px; border:1px solid red; margin-bottom:15px;">
                        <font size="2">{{ error }}</font>
                    </div>
                    {% endif %}

                    <form method="POST">
                        <table cellpadding="8" width="100%">
                            <tr>
                                <td width="30%"><font size="2">Никнейм:</font></td>
                                <td><input type="text" name="username" style="width:100%;padding:5px;border:1px solid #336699;"></td>
                            </tr>
                            <tr>
                                <td><font size="2">Пароль:</font></td>
                                <td><input type="password" name="password" style="width:100%;padding:5px;border:1px solid #336699;"></td>
                            </tr>
                            <tr>
                                <td colspan="2" align="center">
                                    <br>
                                    <input type="submit" value="Войти" 
                                           style="background:#336699;color:white;border:1px solid #336699;padding:8px 20px;cursor:pointer;font-size:14px;">
                                </td>
                            </tr>
                        </table>
                    </form>

                    <br>
                    <hr width="80%" size="1" color="#336699" style="margin:15px 0;">
                    
                    <font size="2">
                        <a href="{{ url_for('register') }}">📝 Создать аккаунт</a><br>
                        <a href="{{ url_for('guest_login') }}">🎭 Войти как гость</a><br>
                        <a href="{{ url_for('index') }}">← На главную</a>
                    </font>
                </center>
            </td>
        </tr>
    </table>
</body>
</html>
