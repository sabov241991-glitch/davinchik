<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <style>
    body { font-family: Arial; background: #f7d9e3; text-align: center; }
    .form-box { margin: 40px auto; padding: 20px; background: #fff; border-radius: 12px; width: 90%; max-width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
    input { display:block; width:90%; margin:10px auto; padding:8px; border-radius:8px; border:1px solid #ccc;}
    .btn { padding:10px 20px; background:#ff4b5c; color:#fff; border:none; border-radius:8px; cursor:pointer; }
    .error { color:red; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Вход</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="text" name="nickname" placeholder="Ник" required>
      <input type="password" name="password" placeholder="Пароль" required>
      <button class="btn" type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
