<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — Давинчик 💌</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:#0b0e14;color:#e7e7ea;margin:0}
    .card{max-width:420px;margin:8vh auto;padding:18px;border:1px solid #23273a;border-radius:14px;background:#0f1422}
    h1{margin:0 0 12px;font-size:20px}
    label{display:block;margin:10px 0 6px;color:#9aa0b4}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid #2b2f45;background:#0b0e14;color:#e7e7ea}
    button{width:100%;padding:12px;border:0;border-radius:10px;background:#7aa2ff;color:#0b0e14;font-weight:700;margin-top:12px}
    a{color:#7aa2ff}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .logo{width:26px;height:20px;background:#fff;border-radius:4px;position:relative}
    .logo:after{content:"";position:absolute;width:10px;height:10px;background:#e5484d;border-radius:50%;right:2px;top:2px}
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="logo"></span>
      <h1>Давинчик 💌 — вход</h1>
    </div>
    <form method="POST">
      <label>Логин</label>
      <input type="text" name="username" required>
      <label>Пароль</label>
      <input type="password" name="password" required>
      <button type="submit">Войти</button>
    </form>
    <p style="margin-top:10px">Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a></p>
  </div>
</body>
</html>
