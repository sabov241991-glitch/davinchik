<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ header_title }}</title>
<style>
  :root{--panel:#eef3fb;--rim-light:#e9eff8;--rim-mid:#b5c1d6;--rim-dark:#8e9db6;}
  body{margin:0;background:linear-gradient(#cad4e5,#b8c6dc) fixed;font-family:"Times New Roman", Georgia, serif}
  .wrap{max-width:720px;margin:8px auto 20px;background:linear-gradient(#d5dff0,#d0dbed);
    border-radius:14px;padding:10px;box-shadow:
    0 0 0 1px var(--rim-dark) inset,0 0 0 4px var(--rim-mid) inset,0 0 0 8px var(--rim-light) inset,
    0 1px 0 #7f8da6,0 2px 0 #aebad0;}
  .head{text-align:center;font-weight:700;font-size:32px;color:#0a2b4f;background:#eef3fb;border-radius:12px;
    padding:10px 8px;box-shadow:inset 0 0 0 2px #e9eff8, inset 0 0 0 6px #fff;}
  .panel{background:#f5f7fc;border-radius:12px;padding:10px;margin-top:10px;
    box-shadow:inset 0 0 0 2px #dee7f7, inset 0 0 0 6px #fff;}
  .title{font-size:26px;text-align:center;margin:4px 0 10px}
  .btn{display:inline-block;background:#f2f6ff;border:1px solid #8ea2c7;border-radius:8px;padding:6px 14px;cursor:pointer;text-decoration:none}
  .center{text-align:center}
  .compress{margin:10px 0;text-align:center;font-size:11px}
  .footer{margin:6px auto 6px;text-align:center}
  .footer-badge{display:inline-block;background:#fff;border:1px solid #b8c6df;border-radius:8px;padding:3px 6px;font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">{{ header_title }}</div>

    <div class="panel">
      <div class="title">Правила регистрации</div>
      <div class="center" style="margin:8px 0 12px">Здесь будут правила. Нажмите «Начать регистрацию», чтобы продолжить.</div>
      <div class="center" style="margin-bottom:8px">
        <a class="btn" href="#">Начать регистрацию</a>
      </div>
      <div class="center">
        <a class="btn" href="{{ url_for('index') }}">На главную</a>
      </div>
    </div>

    <div class="compress">[ 0.0002 | Сжатие: 63.0% ]</div>
    <div class="footer"><span class="footer-badge">©ДАВИНЧИК ©2025</span></div>
  </div>
</body>
</html>
