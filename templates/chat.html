<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - {{ username }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-username="{{ username }}">
    <div class="chat-container">
        <div class="chat-header">
            <h1>Чат комната</h1>
            <p>Добро пожаловать, {{ username }}!</p>
            <button id="logout-button" class="btn" style="margin-top: 10px; padding: 5px 15px;">Выйти</button>
        </div>
        
        <div class="messages" id="messages">
            {% for message in messages %}
            <div class="message {% if message.username == username %}own{% else %}other{% endif %}">
                <div class="message-sender">{{ message.username }}</div>
                <div class="message-text">{{ message.message }}</div>
                <div class="message-time">{{ message.timestamp }}</div>
            </div>
            {% endfor %}
        </div>
        
        <div class="input-container">
            <input type="text" id="message-input" class="message-input" placeholder="Введите сообщение...">
            <button id="send-button" class="send-btn">Отправить</button>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
